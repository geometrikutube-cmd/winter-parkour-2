"use strict";

/* =========================================================
   MUSIC
   ========================================================= */

let musicEnabled =
    localStorage.getItem("winterParkourMusic") === "on";
let audioContext = null;
let musicTimer = null;
let musicStep = 0;

const melody = [
    523.25, 659.25, 783.99, 659.25,
    587.33, 698.46, 880.00, 698.46,
    523.25, 659.25, 783.99, 1046.50,
    880.00, 783.99, 659.25, 523.25
];

function playMusicNote() {
    if (!audioContext || !musicEnabled) return;

    const now = audioContext.currentTime;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "triangle";
    osc.frequency.value = melody[musicStep % melody.length];

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.045, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(now);
    osc.stop(now + 0.24);

    musicStep++;
}

function startMusic() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    if (musicTimer) return;

    playMusicNote();
    musicTimer = setInterval(playMusicNote, 260);
}

function stopMusic() {
    if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
    }
}

const musicButton = document.getElementById("musicButton");

    musicButton.addEventListener("click", function() {

    musicEnabled = !musicEnabled;

    localStorage.setItem(
        "winterParkourMusic",
        musicEnabled ? "on" : "off"
    );

    if (musicEnabled) {

        musicButton.textContent =
            "🔊 Музыка";

        startMusic();

    } else {

        musicButton.textContent =
            "🔇 Музыка";

        stopMusic();
    }
});


if (musicEnabled) {

    musicButton.textContent =
        "🔊 Музыка";

    document.addEventListener(
        "pointerdown",
        function musicUnlock() {

            startMusic();

            document.removeEventListener(
                "pointerdown",
                musicUnlock
            );
        },
        { once: true }
    );

    document.addEventListener(
        "keydown",
        function musicKeyUnlock() {

            startMusic();

            document.removeEventListener(
                "keydown",
                musicKeyUnlock
            );
        },

    );
}

function createSnowTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const ctx =
        canvas.getContext("2d");

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            256,
            256
        );

    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        0.55,
        "#e8f8ff"
    );

    gradient.addColorStop(
        1,
        "#b9d8e8"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        256,
        256
    );

    for (let i = 0; i < 650; i++) {

        const x =
            Math.random() * 256;

        const y =
            Math.random() * 256;

        const r =
            Math.random() * 2 + 0.2;

        ctx.fillStyle =
            `rgba(255,255,255,${0.15 + Math.random() * 0.7})`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        2,
        2
    );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    return texture;
}


function createIceTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const ctx =
        canvas.getContext("2d");

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            256,
            256
        );

    gradient.addColorStop(
        0,
        "#e7fcff"
    );

    gradient.addColorStop(
        0.4,
        "#8fe1f3"
    );

    gradient.addColorStop(
        1,
        "#348fb8"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        256,
        256
    );

    for (let i = 0; i < 22; i++) {

        ctx.strokeStyle =
            "rgba(255,255,255,0.45)";

        ctx.lineWidth =
            Math.random() * 2 + 0.5;

        ctx.beginPath();

        let x =
            Math.random() * 256;

        let y =
            Math.random() * 256;

        ctx.moveTo(x, y);

        for (let j = 0; j < 5; j++) {

            x +=
                Math.random() * 70 - 35;

            y +=
                Math.random() * 70 - 35;

            ctx.lineTo(x, y);
        }

        ctx.stroke();
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        2,
        2
    );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    return texture;
}


function createWoodTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "#68432c";

    ctx.fillRect(
        0,
        0,
        256,
        256
    );

    for (
        let y = 0;
        y < 256;
        y += 32
    ) {

        ctx.fillStyle =
            y % 64 === 0
                ? "#7e5336"
                : "#5c3a27";

        ctx.fillRect(
            0,
            y,
            256,
            30
        );

        ctx.strokeStyle =
            "rgba(20,10,5,0.45)";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            256,
            y
        );

        ctx.stroke();
    }

    for (let i = 0; i < 100; i++) {

        const x =
            Math.random() * 256;

        const y =
            Math.random() * 256;

        ctx.strokeStyle =
            "rgba(20,10,5,0.22)";

        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x + Math.random() * 30 - 15,
            y + Math.random() * 3 - 1.5
        );

        ctx.stroke();
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        2,
        2
    );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    return texture;
}

function box(
    width,
    height,
    depth,
    material
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
}


function cylinder(
    radiusTop,
    radiusBottom,
    height,
    material,
    segments = 16
) {

    const geometry =
        new THREE.CylinderGeometry(
            radiusTop,
            radiusBottom,
            height,
            segments
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
}

    depth,
    height = 0.8,

) {

        x,
        y,
        z

        x: x,
        y: y,
        z: z,
        width: width,
        depth: depth,
        height: height,
        top: y + height / 2
    });

    return mesh;
}

function addLandscapeObject(object, z) {
    object.userData.landscape = true;
    object.userData.z = z;
    scene.add(object);
    landscapeObjects.push(object);
    return object;
}

function createBackgroundMountain(x, z, scale) {
    const group = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.ConeGeometry(1, 2, 8),

            color: 0x8eabbc,
            roughness: 1

}

function generateLandscapeSegment(z) {
    const side = Math.random() < 0.5 ? -1 : 1;

    createBackgroundMountain(
        side * (15 + Math.random() * 5),

    );

    createLamp(

        z + 1.5,

    if (Math.random() < 0.7) {
        createLamp(
            -houseSide * (7.5 + Math.random() * 2),
            z - 5,
            0.8 + Math.random() * 0.18
        );
    }
}

function ensureInfiniteLandscape() {
    const target = player.position.z - GENERATED_AHEAD - 40;

        generateLandscapeSegment(nextLandscapeZ);
        nextLandscapeZ -= 28 + Math.random() * 10;

        const object = landscapeObjects[i];
        if (object.userData.z > cleanupZ) {
            removeInfiniteObject(object);
            landscapeObjects.splice(i, 1);
        }
    }
}

let nextGeneratedZ = -151;

function currentDistance() {
    return Math.max(
        0,
        START_Z - player.position.z
    );
}

function currentLevel() {
    return 1 + Math.floor(
        currentDistance() / 500
    );
}

function getRunSpeed() {
    return Math.min(
        12,
        AUTO_SPEED + currentDistance() * 0.0018
    );
}

function removeInfiniteObject(mesh) {
    if (mesh && mesh.parent) {
        mesh.parent.remove(mesh);
    }
}

function cleanupInfiniteWorld() {
    const limit =
        player.position.z + GENERATED_BEHIND;

    for (let i = platforms.length - 1; i >= 0; i--) {
        const p = platforms[i];
        if (p.dynamic && p.z > limit) {
            removeInfiniteObject(p.mesh);
            platforms.splice(i, 1);
        }
    }

    for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        if (h.dynamic && h.z > limit) {
            removeInfiniteObject(h.mesh);
            hazards.splice(i, 1);
        }
    }

    for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        if (c.dynamic && c.mesh.position.z > limit) {
            removeInfiniteObject(c.mesh);
            coins.splice(i, 1);
        }
    }

    for (let i = trees.length - 1; i >= 0; i--) {
        const tree = trees[i];
        if (tree.userData.dynamic && tree.position.z > limit) {
            removeInfiniteObject(tree);
            trees.splice(i, 1);
        }
    }
}

function generateInfiniteChunk() {
    const level = currentLevel();

    const gap =
        8.0 + Math.random() * 1.2;

    nextGeneratedZ -= gap;

    const maxX = Math.min(4.5, 3.2 + level * 0.15);

    generatedX = THREE.MathUtils.clamp(
        generatedX + (Math.random() * 4 - 2),
        -maxX,
        maxX
    );

    const maxStepY = Math.min(1.1, 0.65 + level * 0.06);

    generatedY = THREE.MathUtils.clamp(
        generatedY + (Math.random() * 2 - 1) * maxStepY,
        0,
        18
    );

    const width = Math.max(5.2, 7.3 - Math.min(level, 15) * 0.10 - Math.random() * 0.9);
    const depth = 6.9 + Math.random() * 0.9;

    const roll = Math.random();
    const material =
        roll < 0.25 ? mats.ice :
        roll < 0.50 ? mats.wood :
        mats.snow;

    platform(
        generatedX,
        generatedY,
        nextGeneratedZ,
        width,
        depth,
        0.8,
        material
    );

    platforms[platforms.length - 1].dynamic = true;

    createCoin(
        generatedX,
        generatedY + 1.25,
        nextGeneratedZ
    );

    coins[coins.length - 1].dynamic = true;

    const hazardChance =
        Math.min(0.42, 0.16 + level * 0.025);

    if (Math.random() < hazardChance) {
        const hazardWidth =
            1.15 + Math.random() * 0.55;

        const hazardHeight =
            1.0 + Math.random() * 0.8;

        const hazardX =
            THREE.MathUtils.clamp(
                generatedX + (Math.random() * 2.4 - 1.2),
                generatedX - width / 2 + 0.9,
                generatedX + width / 2 - 0.9
            );

        hazard(
            hazardX,
            generatedY + 0.4 + hazardHeight / 2,
            nextGeneratedZ,
            hazardWidth,
            hazardHeight,
            1.15,
            Math.random() < 0.5 ? mats.red : mats.blue
        );

        hazards[hazards.length - 1].dynamic = true;
    }

    if (Math.random() < 0.7) {
        const side = Math.random() < 0.5 ? -1 : 1;
        const tree = createTree(
            side * (7 + Math.random() * 2.5),
            Math.max(0, generatedY - 0.2),
            nextGeneratedZ,
            0.9 + Math.random() * 0.55
        );

        tree.userData.dynamic = true;
    }
}

function ensureInfiniteWorld() {
    while (nextGeneratedZ > player.position.z - GENERATED_AHEAD) {
        generateInfiniteChunk();
    }

    cleanupInfiniteWorld();
    ensureInfiniteLandscape();
}

const keys = {
    left: false,
    right: false,
    jump: false
};


function setKey(
    key,
    value
) {

    keys[key] = value;

    if (
        key === "jump" &&
        value
    ) {
        jumpBufferTimer =
            JUMP_BUFFER_TIME;
    }
}


window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "ArrowLeft" ||
            event.code === "KeyA"
        ) {
            keys.left = true;
            event.preventDefault();
        }

        if (
            event.code === "ArrowRight" ||
            event.code === "KeyD"
        ) {
            keys.right = true;
            event.preventDefault();
        }

        if (
            event.code === "Space" ||
            event.code === "ArrowUp" ||
            event.code === "KeyW"
        ) {
            if (!keys.jump) {
                setKey(
                    "jump",
                    true
                );
            }

            event.preventDefault();
        }

        if (
            event.code === "KeyR" &&
            gameOver
        ) {
            location.reload();
        }
    },
    {
        passive: false
    }
);


window.addEventListener(
    "keyup",
    function(event) {

        if (
            event.code === "ArrowLeft" ||
            event.code === "KeyA"
        ) {
            keys.left = false;
            event.preventDefault();
        }

        if (
            event.code === "ArrowRight" ||
            event.code === "KeyD"
        ) {
            keys.right = false;
            event.preventDefault();
        }

        if (
            event.code === "Space" ||
            event.code === "ArrowUp" ||
            event.code === "KeyW"
        ) {
            keys.jump = false;
            event.preventDefault();
        }
    },
    {
        passive: false
    }
);


/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

function holdButton(
    element,
    key
) {

    element.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            element.setPointerCapture(
                event.pointerId
            );

            setKey(
                key,
                true
            );
        }
    );

    element.addEventListener(
        "pointerup",
        function(event) {

            event.preventDefault();

            setKey(
                key,
                false
            );
        }
    );

    element.addEventListener(
        "pointercancel",
        function() {

            setKey(
                key,
                false
            );
        }
    );

    element.addEventListener(
        "pointerleave",
        function(event) {

            if (
                event.buttons === 0
            ) {
                setKey(
                    key,
                    false
                );
            }
        }
    );
}

    ),

holdButton(

    ),

holdButton(

        "jumpButton"
    ),

/* =========================================================
   COLLISION HELPERS
   ========================================================= */

function playerHalfWidth() {
    return PLAYER_WIDTH / 2;
}


function isInsidePlatformX(
    p,
    platformData
) {

    const half =
        playerHalfWidth();

    return (
        p.position.x + half >
        platformData.x -
        platformData.width / 2
        &&
        p.position.x - half <
        platformData.x +
        platformData.width / 2
    );
}


function isInsidePlatformZ(
    p,
    platformData
) {

    const half =
        0.35;

    return (
        p.position.z + half >
        platformData.z -
        platformData.depth / 2
        &&
        p.position.z - half <
        platformData.z +
        platformData.depth / 2
    );
}


/* =========================================================
   PLATFORM COLLISION
   ========================================================= */

function updateGroundCollision() {

    const oldY =
        player.position.y;

    const bottom =
        player.position.y -
        PLAYER_HEIGHT / 2;

    let landingPlatform = null;

    for (
        const p of platforms
    ) {

        if (
            !isInsidePlatformX(
                player,
                p
            )
        ) {
            continue;
        }

        if (
            !isInsidePlatformZ(
                player,
                p
            )
        ) {
            continue;
        }

        const top =
            p.top;

        if (
            velocityY <= 0 &&
            bottom <= top + 0.35 &&
            bottom >= top - 1.0
        ) {

            landingPlatform = p;
            break;
        }
    }

    if (landingPlatform) {

        player.position.y =
            landingPlatform.top +
            PLAYER_HEIGHT / 2;

        velocityY = 0;

        onGround = true;

        coyoteTimer =
            COYOTE_TIME;

    } else {

        onGround = false;

        if (
            oldY >
            player.position.y
        ) {
            coyoteTimer = 0;
        }
    }
}


/* =========================================================
   HAZARD COLLISION
   ========================================================= */

function checkHazards() {

    const px =
        player.position.x;

    const py =
        player.position.y;

    const pz =
        player.position.z;

    for (
        const h of hazards
    ) {

        const hx =
            h.x;

        const hy =
            h.y;

        const hz =
            h.z;

        const hitX =
            Math.abs(px - hx) <
            (PLAYER_WIDTH / 2 +
             h.width / 2);

        const hitY =
            Math.abs(py - hy) <
            (PLAYER_HEIGHT / 2 +
             h.height / 2);

        const hitZ =
            Math.abs(pz - hz) <
            (0.45 +
             h.depth / 2);

        if (
            hitX &&
            hitY &&
            hitZ
        ) {
            return true;
        }
    }

    return false;
}


/* =========================================================
   COIN COLLECTION
   ========================================================= */

function updateCoins(
    time
) {

    for (
        const coin of coins
    ) {

        if (
            coin.collected
        ) {
            continue;
        }

        coin.mesh.rotation.y +=
            3.2 * time;

        coin.mesh.rotation.z +=
            1.1 * time;

        coin.mesh.position.y =
            coin.baseY +
            Math.sin(
                animTime * 3 +
                coin.phase
            ) * 0.14;

        const dx =
            player.position.x -
            coin.mesh.position.x;

        const dy =
            player.position.y -
            coin.mesh.position.y;

        const dz =
            player.position.z -
            coin.mesh.position.z;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy +
                dz * dz
            );

        if (
            distance < 2.2
        ) {

            coin.collected = true;

            coin.mesh.visible = false;

            coinCount++;

            updateUI();
        }
    }
}


/* =========================================================
   PLAYER ANIMATION
   ========================================================= */
function updatePlayerAnimation(
    dt
) {

    animTime += dt;

    const horizontalSpeed =
        Math.abs(velocityX);

    const running =
        onGround &&
        horizontalSpeed > 0.15;


    if (running) {

        const swing =
            Math.sin(
                animTime * 10
            ) * 0.48;

        const armSwing =
            Math.sin(
                animTime * 10
            ) * 0.34;


        leftLegPivot.rotation.x =
            THREE.MathUtils.damp(
                leftLegPivot.rotation.x,
                swing,
                14,
                dt
            );

        rightLegPivot.rotation.x =
            THREE.MathUtils.damp(
                rightLegPivot.rotation.x,
                -swing,
                14,
                dt
            );


        leftArmPivot.rotation.x =
            THREE.MathUtils.damp(
                leftArmPivot.rotation.x,
                -armSwing,
                14,
                dt
            );

        rightArmPivot.rotation.x =
            THREE.MathUtils.damp(
                rightArmPivot.rotation.x,
                armSwing,
                14,
                dt
            );

    } else if (onGround) {

        leftLegPivot.rotation.x =
            THREE.MathUtils.damp(
                leftLegPivot.rotation.x,
                0,
                12,
                dt
            );

        rightLegPivot.rotation.x =
            THREE.MathUtils.damp(
                rightLegPivot.rotation.x,
                0,
                12,
                dt
            );

        leftArmPivot.rotation.x =
            THREE.MathUtils.damp(
                leftArmPivot.rotation.x,
                0,
                12,
                dt
            );

        rightArmPivot.rotation.x =
            THREE.MathUtils.damp(
                rightArmPivot.rotation.x,
                0,
                12,
                dt
            );

    } else {

        /* JUMP */

        leftArmPivot.rotation.x =
            THREE.MathUtils.damp(
                leftArmPivot.rotation.x,
                -0.7,
                10,
                dt
            );

        rightArmPivot.rotation.x =
            THREE.MathUtils.damp(
                rightArmPivot.rotation.x,
                -0.7,
                10,
                dt
            );

        leftLegPivot.rotation.x =
            THREE.MathUtils.damp(
                leftLegPivot.rotation.x,
                0.25,
                10,
                dt
            );

        rightLegPivot.rotation.x =
            THREE.MathUtils.damp(
                rightLegPivot.rotation.x,
                -0.25,
                10,
                dt
            );
    }


    /* BODY LEAN */

    const targetTilt =
        THREE.MathUtils.clamp(
            -velocityX * 0.045,
            -0.28,
            0.28
        );

    player.rotation.z =
        THREE.MathUtils.damp(
            player.rotation.z,
            targetTilt,
            9,
            dt
        );


    /* SMALL BODY BOUNCE */

    const targetBodyY =
        running
            ? Math.abs(
                Math.sin(
                    animTime * 10
                )
            ) * 0.045
            : 0;

    body.position.y =
        THREE.MathUtils.damp(
            body.position.y,
            targetBodyY,
            12,
            dt
        );
}

/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function updatePlayer(
    dt
) {

    if (
        gameOver ||
        finished
    ) {
        return;
    }

    /* AUTO FORWARD */

    player.position.z -=
        getRunSpeed() * dt;


    /* HORIZONTAL INPUT */

    let direction = 0;

    if (keys.left) {
        direction -= 1;
    }

    if (keys.right) {
        direction += 1;
    }


    /* SMOOTH ACCELERATION */

    if (direction !== 0) {

        const target =
            direction *
            SIDE_SPEED;

        velocityX =
            THREE.MathUtils.damp(
                velocityX,
                target,
                SIDE_ACCEL,
                dt
            );

    } else {

        velocityX =
            THREE.MathUtils.damp(
                velocityX,
                0,
                SIDE_FRICTION,
                dt
            );
    }


    player.position.x +=
        velocityX * dt;


    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -WORLD_LIMIT_X,
            WORLD_LIMIT_X
        );


    /* COYOTE TIME */

    if (
        !onGround &&
        coyoteTimer > 0
    ) {
        coyoteTimer -= dt;
    }


    /* JUMP BUFFER */

    if (
        jumpBufferTimer > 0
    ) {
        jumpBufferTimer -= dt;
    }


    /* JUMP */

    if (
        jumpBufferTimer > 0 &&
        (
            onGround ||
            coyoteTimer > 0
        )
    ) {

        velocityY =
            JUMP_FORCE;

        onGround = false;

        coyoteTimer = 0;

        jumpBufferTimer = 0;
    }


    /* GRAVITY */

    velocityY -=
        GRAVITY * dt;


    /* SHORT JUMP */

    if (
        !keys.jump &&
        velocityY > 0
    ) {

        velocityY -=
            GRAVITY * 0.65 * dt;
    }


    player.position.y +=
        velocityY * dt;


    updateGroundCollision();


    /* FALL */

    if (
        player.position.y < -8
    ) {

        showGameOver(
            "Ты упал!"
        );

        return;
    }


    /* HAZARDS */

    if (
        checkHazards()
    ) {

        showGameOver(
            "Ой! Препятствие!"
        );

        return;
    }


    /* БЕСКОНЕЧНАЯ ТРАССА */

    ensureInfiniteWorld();
}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(
    dt
) {

    const targetX =
        player.position.x * 0.38;

    const targetY =
        player.position.y + 5.2;

    const targetZ =
        player.position.z + 10.5;

    camera.position.x =
        THREE.MathUtils.damp(
            camera.position.x,
            targetX,
            5.5,
            dt
        );

    camera.position.y =
        THREE.MathUtils.damp(
            camera.position.y,
            targetY,
            5.5,
            dt
        );

    camera.position.z =
        THREE.MathUtils.damp(
            camera.position.z,
            targetZ,
            7,
            dt
        );

    const lookTarget =
        new THREE.Vector3(
            player.position.x * 0.35,
            player.position.y + 0.6,
            player.position.z - 8
        );

    camera.lookAt(
        lookTarget
    );
}


/* =========================================================
   SNOW ANIMATION
   ========================================================= */

function updateSnow(
    dt
) {

    const position =
        snowParticles.geometry
            .attributes
            .position;

    for (
        let i = 0;
        i < snowParticleCount;
        i++
    ) {

        let x =
            position.array[i * 3];

        let y =
            position.array[i * 3 + 1];

        let z =
            position.array[i * 3 + 2];

        y -=
            dt * 1.8;

        z +=
            getRunSpeed() * dt * 0.25;

        x +=
            Math.sin(
                animTime * 0.8 +
                i
            ) * dt * 0.15;

        if (
            y < 0
        ) {
            y = 27;
        }

        if (
            z > player.position.z + 18
        ) {
            z =
                player.position.z - 100;
        }

        position.array[i * 3] =
            x;

        position.array[i * 3 + 1] =
            y;

        position.array[i * 3 + 2] =
            z;
    }

    position.needsUpdate = true;
}


/* =========================================================
   UI
   ========================================================= */

function updateUI() {

    document.getElementById(
        "coinsUI"
    ).textContent =
        "❄️ Монеты: " +
        coinCount;

    const distance =
        Math.max(
            0,
            Math.round(
                START_Z -
                player.position.z
            )
        );

    document.getElementById(
        "distanceUI"
    ).textContent =
        "Дистанция: " +
        distance +
        " м";

    const level = currentLevel();

    document.getElementById(
        "levelUI"
    ).textContent =
        "Уровень: " +
        level;
}


/* =========================================================
   GAME OVER
   ========================================================= */

function showGameOver(
    text
) {

    if (
        gameOver
    ) {
        return;
    }

    gameOver = true;

    document.getElementById(
        "messageTitle"
    ).textContent =
        "Игра окончена";

    document.getElementById(
        "messageText"
    ).textContent =
        text +
        " Монеты: " +
        coinCount;

    document.getElementById(
        "message"
    ).classList.add(
        "show"
    );
}


/* =========================================================
   FINISH
   ========================================================= */

function finishGame() {

    if (
        finished
    ) {
        return;
    }

    finished = true;

    document.getElementById(
        "messageTitle"
    ).textContent =
        "🏆 Финиш!";

    document.getElementById(
        "messageText"
    ).textContent =
        "Ты прошёл зимний паркур и собрал " +
        coinCount +
        " из " +
        coins.length +
        " монет.";

    document.getElementById(
        "message"
    ).classList.add(
        "show"
    );
}


/* =========================================================
   RESTART
   ========================================================= */

document.getElementById(
    "restartButton"
).addEventListener(
    "click",
    function() {

        location.reload();
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );
    }
);


/* =========================================================
   INITIALIZE INFINITE WORLD
   ========================================================= */

ensureInfiniteWorld();


/* =========================================================
   INITIAL CAMERA
   ========================================================= */

camera.position.set(
    0,
    5.2,
    13
);

camera.lookAt(
    0,
    1,
    -5
);


/* =========================================================
   GAME LOOP
   ========================================================= */

function animate(
    currentTime
) {

    requestAnimationFrame(
        animate
    );

    let dt =
        (currentTime -
         previousTime) /
        1000;

    previousTime =
        currentTime;

    dt =
        Math.min(
            dt,
            0.033
        );


    updatePlayer(
        dt
    );

    updateCamera(
        dt
    );

    updateCoins(
        dt
    );

    updatePlayerAnimation(
        dt
    );

    updateSnow(
        dt
    );

    updateUI();


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
   ========================================================= */

updateUI();

requestAnimationFrame(
    animate
);

</script>
