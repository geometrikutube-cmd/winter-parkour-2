<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

}

body {

}

canvas {
    display: block;

    height: 100%;
}

}

    backdrop-filter: blur(8px);

#coinsUI {

#distanceUI {

#levelUI {

    65% { transform: translateZ(24px) scale(1.16) rotateY(8deg); opacity: 1; }

@keyframes celebrationSpark {
    from { transform: translateZ(0) rotate(-10deg) translateY(2px) scale(0.9); }
    to { transform: translateZ(18px) rotate(10deg) translateY(-5px) scale(1.14); }
}

@media (max-width: 700px) {
    #coinCelebrationText {

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   MUSIC
   ========================================================= */

let musicEnabled =
    localStorage.getItem("winterParkourMusic") === "on";
let audioContext = null;
let musicTimer = null;
let musicStep = 0;

const melody = [
    523.25, 659.25, 783.99, 659.25,
    587.33, 698.46, 880.00, 698.46,
    523.25, 659.25, 783.99, 1046.50,
    880.00, 783.99, 659.25, 523.25
];

function playMusicNote() {
    if (!audioContext || !musicEnabled) return;

    const now = audioContext.currentTime;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "triangle";
    osc.frequency.value = melody[musicStep % melody.length];

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.045, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(now);
    osc.stop(now + 0.24);

    musicStep++;
}

function startMusic() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    if (musicTimer) return;

    playMusicNote();
    musicTimer = setInterval(playMusicNote, 260);
}

function stopMusic() {
    if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
    }
}

const musicButton = document.getElementById("musicButton");

    musicButton.addEventListener("click", function() {

    musicEnabled = !musicEnabled;

    localStorage.setItem(
        "winterParkourMusic",
        musicEnabled ? "on" : "off"
    );

    if (musicEnabled) {

        musicButton.textContent =
            "🔊 Музыка";

        startMusic();

    } else {

        musicButton.textContent =
            "🔇 Музыка";

        stopMusic();
    }
});


if (musicEnabled) {

    musicButton.textContent =
        "🔊 Музыка";

    document.addEventListener(
        "pointerdown",
        function musicUnlock() {

            startMusic();

            document.removeEventListener(
                "pointerdown",
                musicUnlock
            );
        },
        { once: true }
    );

    document.addEventListener(
        "keydown",
        function musicKeyUnlock() {

            startMusic();

            document.removeEventListener(
                "keydown",
                musicKeyUnlock
            );
        },
        { once: true }
    );
}

/* =========================================================
   WINTER BLOCK PARKOUR
   ========================================================= */

const AUTO_SPEED = 6.6;
const SIDE_SPEED = 7.5;
const SIDE_ACCEL = 32;
const SIDE_FRICTION = 38;

const JUMP_FORCE = 8.8;
const GRAVITY = 22;

const COYOTE_TIME = 0.13;
const JUMP_BUFFER_TIME = 0.14;

const PLAYER_WIDTH = 0.8;
const PLAYER_HEIGHT = 2.4;

const START_Z = 3;
const FINISH_Z = -151;

const WORLD_LIMIT_X = 6.2;


/* =========================================================
   SCENE
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9edcff);

scene.fog = new THREE.Fog(
    0x9edcff,
    38,
    125
);


/* =========================================================
   CAMERA
   ========================================================= */

const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    250
);

camera.position.set(
    0,
    5.5,
    14
);


/* =========================================================
   RENDERER
   ========================================================= */

const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || Math.min(window.innerWidth, window.innerHeight) < 700;

const renderer = new THREE.WebGLRenderer({
    antialias: !isMobile,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, isMobile ? 1.25 : 1.75)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
   ========================================================= */

const hemi = new THREE.HemisphereLight(
    0xe8f8ff,
    0x3c5265,
    2.2
);

scene.add(hemi);


const sun = new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    25,
    40,
    15
);

sun.castShadow = true;

sun.shadow.mapSize.width = isMobile ? 1024 : 2048;
sun.shadow.mapSize.height = isMobile ? 1024 : 2048;

sun.shadow.camera.left = -55;
sun.shadow.camera.right = 55;
sun.shadow.camera.top = 55;
sun.shadow.camera.bottom = -55;

sun.shadow.camera.near = 1;
sun.shadow.camera.far = 160;

scene.add(sun);


/* =========================================================
   TEXTURES
   ========================================================= */

function createSnowTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const ctx =
        canvas.getContext("2d");

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            256,
            256
        );

    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        0.55,
        "#e8f8ff"
    );

    gradient.addColorStop(
        1,
        "#b9d8e8"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        256,
        256
    );

    for (let i = 0; i < 650; i++) {

        const x =
            Math.random() * 256;

        const y =
            Math.random() * 256;

        const r =
            Math.random() * 2 + 0.2;

        ctx.fillStyle =
            `rgba(255,255,255,${0.15 + Math.random() * 0.7})`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        2,
        2
    );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    return texture;
}


function createIceTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const ctx =
        canvas.getContext("2d");

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            256,
            256
        );

    gradient.addColorStop(
        0,
        "#e7fcff"
    );

    gradient.addColorStop(
        0.4,
        "#8fe1f3"
    );

    gradient.addColorStop(
        1,
        "#348fb8"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        256,
        256
    );

    for (let i = 0; i < 22; i++) {

        ctx.strokeStyle =
            "rgba(255,255,255,0.45)";

        ctx.lineWidth =
            Math.random() * 2 + 0.5;

        ctx.beginPath();

        let x =
            Math.random() * 256;

        let y =
            Math.random() * 256;

        ctx.moveTo(x, y);

        for (let j = 0; j < 5; j++) {

            x +=
                Math.random() * 70 - 35;

            y +=
                Math.random() * 70 - 35;

            ctx.lineTo(x, y);
        }

        ctx.stroke();
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        2,
        2
    );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    return texture;
}


function createWoodTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "#68432c";

    ctx.fillRect(
        0,
        0,
        256,
        256
    );

    for (
        let y = 0;
        y < 256;
        y += 32
    ) {

        ctx.fillStyle =
            y % 64 === 0
                ? "#7e5336"
                : "#5c3a27";

        ctx.fillRect(
            0,
            y,
            256,
            30
        );

        ctx.strokeStyle =
            "rgba(20,10,5,0.45)";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            256,
            y
        );

        ctx.stroke();
    }

    for (let i = 0; i < 100; i++) {

        const x =
            Math.random() * 256;

        const y =
            Math.random() * 256;

        ctx.strokeStyle =
            "rgba(20,10,5,0.22)";

        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x + Math.random() * 30 - 15,
            y + Math.random() * 3 - 1.5
        );

        ctx.stroke();
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        2,
        2
    );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    return texture;
}


const snowTexture =
    createSnowTexture();

const iceTexture =
    createIceTexture();

const woodTexture =
    createWoodTexture();


/* =========================================================
   MATERIALS
   ========================================================= */

const mats = {

    snow:
        new THREE.MeshStandardMaterial({
            map: snowTexture,
            roughness: 0.84
        }),

    ice:
        new THREE.MeshStandardMaterial({
            map: iceTexture,
            roughness: 0.22,
            metalness: 0.12
        }),

    wood:
        new THREE.MeshStandardMaterial({
            map: woodTexture,
            roughness: 0.9
        }),

    blue:
        new THREE.MeshStandardMaterial({
            color: 0x2b7ac3,
            roughness: 0.62
        }),

    dark:
        new THREE.MeshStandardMaterial({
            color: 0x16334f,
            roughness: 0.75
        }),

    white:
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.82
        }),

    red:
        new THREE.MeshStandardMaterial({
            color: 0xd63232,
            roughness: 0.62
        }),

    gold:
        new THREE.MeshStandardMaterial({
            color: 0xffd83d,
            emissive: 0x805000,
            emissiveIntensity: 0.5,
            metalness: 0.65,
            roughness: 0.22
        }),

    black:
        new THREE.MeshStandardMaterial({
            color: 0x111820,
            roughness: 0.8
        }),

    green:
        new THREE.MeshStandardMaterial({
            color: 0x27583a,
            roughness: 0.9
        })
};


/* =========================================================
   HELPERS
   ========================================================= */

function box(
    width,
    height,
    depth,
    material
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
}


function cylinder(
    radiusTop,
    radiusBottom,
    height,
    material,
    segments = 16
) {

    const geometry =
        new THREE.CylinderGeometry(
            radiusTop,
            radiusBottom,
            height,
            segments
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
}


/* =========================================================
   WORLD DATA
   ========================================================= */

const platforms = [];
const hazards = [];
const coins = [];
const trees = [];
const mountains = [];


/* =========================================================
   PLATFORM
   ========================================================= */

function platform(
    x,
    y,
    z,
    width,
    depth,
    height = 0.8,
    material = mats.snow
) {

    const mesh =
        box(
            width,
            height,
            depth,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    scene.add(mesh);

    platforms.push({
        mesh: mesh,
        x: x,
        y: y,
        z: z,
        width: width,
        depth: depth,
        height: height,
        top: y + height / 2
    });

    return mesh;
}


/* =========================================================
   COURSE
   ========================================================= */

platform(

    0,
    2,
    10,
    8,
    0.8,
    mats.snow
);

platform(

    0,
    -6,

    mats.snow
);

platform(

platform(

    5,

    0.8,
    mats.snow
);

platform(
    3,
    3,
    -33,
    6,
    5,
    0.8,
    mats.snow
);

platform(
    -3,
    4,
    -42,
    5,
    6,
    0.8,
    mats.ice
);

platform(
    2,
    5,
    -52,
    7,
    7,
    0.8,
    mats.snow

platform(
    0,

/* LEVEL 2 */
platform(-2, 6, -73, 7, 7, 0.8, mats.snow);
platform(3, 7, -83, 6, 6, 0.8, mats.ice);
platform(-3, 8, -94, 6, 7, 0.8, mats.snow);

/* LEVEL 3 */
platform(2, 9, -105, 7, 7, 0.8, mats.snow);

/* =========================================================
   DETAILED ICE SPIKES
   =========================================================
   Шипы сделаны группой из нескольких ледяных элементов.
   Главное острие направлено ВВЕРХ, а вся группа двигается
   по поверхности платформы.
   ========================================================= */

const spikeMainGeometry = new THREE.ConeGeometry(
    0.92,
    2.0,
    8,
    3
);

const spikeInnerGeometry = new THREE.ConeGeometry(
    0.62,
    1.58,
    6,
    2
);

const spikeBaseGeometry = new THREE.CylinderGeometry(
    0.78,
    0.92,
    0.22,
    8
);

function createIceSpike(
    x,
    y,
    z,
    width,
    height,
    depth
) {
    const group = new THREE.Group();

    /*
       Основной кристалл.
       ConeGeometry уже смотрит остриём вверх,
       поэтому rotation.x = Math.PI больше НЕ нужен.
    */
    const main = new THREE.Mesh(
        spikeMainGeometry,
        mats.ice
    );

    main.scale.set(
        width * 0.52,
        height * 0.5,
        depth * 0.52
    );

    main.position.y = height * 0.02;
    main.castShadow = true;
    main.receiveShadow = true;
    group.add(main);

    /* Светлая внутренняя грань для более "ледяного" вида. */
    const inner = new THREE.Mesh(
        spikeInnerGeometry,
        mats.white
    );

    inner.scale.set(
        width * 0.32,
        height * 0.43,
        depth * 0.32
    );

    inner.position.set(
        -width * 0.08,
        height * 0.04,
        -depth * 0.06
    );

    inner.rotation.y = 0.35;
    inner.castShadow = true;
    group.add(inner);

    /* Ледяное основание. */
    const base = new THREE.Mesh(
        spikeBaseGeometry,
        mats.ice
    );

    base.scale.set(
        width * 0.62,
        Math.max(0.7, height * 0.55),
        depth * 0.62
    );

    base.position.y = -height * 0.43;
    base.castShadow = true;
    base.receiveShadow = true;
    group.add(base);

    /* Две маленькие боковые грани-кристаллы. */
    for (let i = 0; i < 2; i++) {
        const shard = new THREE.Mesh(
            new THREE.ConeGeometry(0.22, 0.72, 5, 1),
            mats.ice
        );

        shard.scale.set(
            width * 0.55,
            height * 0.55,
            depth * 0.55
        );

        shard.position.set(
            (i === 0 ? -1 : 1) * width * 0.28,
            -height * 0.16,
            (i === 0 ? 1 : -1) * depth * 0.12
        );

        shard.rotation.z =
            (i === 0 ? -1 : 1) * 0.18;

        shard.rotation.y =
            i * Math.PI * 0.5;

        shard.castShadow = true;
        group.add(shard);
    }

    group.position.set(x, y, z);

    scene.add(group);

    return group;
}

function hazard(
    x,
    y,
    z,
    width,
    height,
    depth,
    material = mats.ice,
    options = {}
) {
    const mesh = createIceSpike(
        x,
        y,
        z,
        width,
        height,
        depth
    );

    /*
       Находим платформу, на которой стоит шип.
       Это позволяет двигать его только внутри платформы,
       а не за её края.
    */
    let platformData = null;

    for (const p of platforms) {
        const zInside =
            Math.abs(z - p.z) <= p.depth / 2 + 0.15;

        const yNear =
            Math.abs((p.top + height / 2) - y) < 0.75;

        if (zInside && yNear) {
            platformData = p;
            break;
        }
    }

    const defaultAmplitude = platformData
        ? Math.max(
            0,
            Math.min(
                pWidthSafe(platformData.width, width),
                platformData.width * 0.34
            )
        )
        : 0.9;

    const moving =
        options.moving !== undefined
            ? options.moving
            : true;

    const amplitude =
        options.amplitude !== undefined
            ? options.amplitude
            : defaultAmplitude;

    const h = {
        mesh: mesh,
        x: x,
        y: y,
        z: z,

        baseX: x,
        baseZ: z,

        width: width,
        height: height,
        depth: depth,

        moving: moving,
        amplitude: amplitude,
        speed:
            options.speed !== undefined
                ? options.speed
                : 1.25 + Math.random() * 1.15,

        phase: Math.random() * Math.PI * 2,

        platform: platformData,

        /* Направление движения: по ширине платформы. */
        moveAxis: "x"
    };

    hazards.push(h);

    return mesh;
}

function pWidthSafe(platformWidth, spikeWidth) {
    return Math.max(
        0,
        platformWidth / 2 - spikeWidth / 2 - 0.35
    );
}

}

function cleanupInfiniteWorld() {
    const limit =
        player.position.z + GENERATED_BEHIND;

    for (let i = platforms.length - 1; i >= 0; i--) {
        const p = platforms[i];
        if (p.dynamic && p.z > limit) {
            removeInfiniteObject(p.mesh);
            platforms.splice(i, 1);
        }
    }

    for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        if (h.dynamic && h.z > limit) {
            removeInfiniteObject(h.mesh);
            hazards.splice(i, 1);
        }
    }

    for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        if (c.dynamic && c.mesh.position.z > limit) {
            removeInfiniteObject(c.mesh);
            coins.splice(i, 1);
        }
    }

    for (let i = trees.length - 1; i >= 0; i--) {
        const tree = trees[i];
        if (tree.userData.dynamic && tree.position.z > limit) {
            removeInfiniteObject(tree);
            trees.splice(i, 1);
        }
    }

    for (let i = mountains.length - 1; i >= 0; i--) {
        const mountain = mountains[i];
        if (mountain.position.z > limit) {
            removeInfiniteObject(mountain);
            mountains.splice(i, 1);
        }
    }
}

function generateInfiniteChunk() {
    const level = currentLevel();

    const gap =
        10.6 + Math.random() * 1.2;

    nextGeneratedZ -= gap;

    const maxX = Math.min(4.5, 3.2 + level * 0.15);

    generatedX = THREE.MathUtils.clamp(
        generatedX + (Math.random() * 4 - 2),
        -maxX,
        maxX
    );

    const maxStepY = Math.min(1.1, 0.65 + level * 0.06);

    generatedY = THREE.MathUtils.clamp(
        generatedY + (Math.random() * 2 - 1) * maxStepY,
        0,
        18
    );

    const width = Math.max(5.2, 7.3 - Math.min(level, 15) * 0.10 - Math.random() * 0.9);
    const depth = 6.0 + Math.random() * 0.8;

    const roll = Math.random();
    const material =
        roll < 0.25 ? mats.ice :
        roll < 0.50 ? mats.wood :
        mats.snow;

    platform(
        generatedX,
        generatedY,
        nextGeneratedZ,
        width,
        depth,
        0.8,
        material
    );

    platforms[platforms.length - 1].dynamic = true;

    createCoin(
        generatedX,
        generatedY + 1.25,
        nextGeneratedZ
    );

    coins[coins.length - 1].dynamic = true;

    const hazardChance =
        Math.min(0.42, 0.16 + level * 0.025);

    if (Math.random() < hazardChance) {
        const hazardWidth =
            1.15 + Math.random() * 0.55;

        const hazardHeight =
            1.0 + Math.random() * 0.8;

        const hazardX =
            THREE.MathUtils.clamp(
                generatedX + (Math.random() * 2.4 - 1.2),
                generatedX - width / 2 + 0.9,
                generatedX + width / 2 - 0.9
            );

        hazard(
            hazardX,
            generatedY + 0.4 + hazardHeight / 2,
            nextGeneratedZ,
            hazardWidth,
            hazardHeight,
            1.15,
            mats.ice,
            {
                moving: true,
                amplitude: Math.max(
                    0.55,
                    Math.min(
                        width / 2 - hazardWidth / 2 - 0.35,
                        0.8 + Math.random() * 1.35
                    )
                ),
                speed: 1.1 + Math.random() * 1.25
            }
        );

        const movingSpike = hazards[hazards.length - 1];
        movingSpike.dynamic = true;
    }

    if (Math.random() < 0.38) {
        const side = Math.random() < 0.5 ? -1 : 1;
        const tree = createTree(
            side * (7 + Math.random() * 2.5),
            Math.max(0, generatedY - 0.2),
            nextGeneratedZ,
            0.9 + Math.random() * 0.55
        );

        tree.userData.dynamic = true;
    }

    // Дальние горы продолжаются бесконечно вместе с трассой.
    // Создаём их реже, чтобы сохранить FPS.
    if (Math.random() < 0.72) {
        const side = Math.random() < 0.5 ? -1 : 1;
        const mountain = createDynamicMountain(
            side * (13.5 + Math.random() * 3.5),
            Math.max(4, generatedY * 0.45 + 4),
            nextGeneratedZ - 4 - Math.random() * 5,
            7.5 + Math.random() * 5.0
        );
        mountains.push(mountain);
    }
}

let worldWarmup = true;

function ensureInfiniteWorld() {
    let created = 0;
    const maxChunksThisFrame = worldWarmup ? 999 : (isMobile ? 2 : 4);

    while (nextGeneratedZ > player.position.z - GENERATED_AHEAD && created < maxChunksThisFrame) {
        generateInfiniteChunk();
        created++;
    }

    if (nextGeneratedZ <= player.position.z - GENERATED_AHEAD) {
        worldWarmup = false;
    }

    cleanupInfiniteWorld();
}


/* =========================================================
   INPUT
   ========================================================= */

const keys = {
    left: false,
    right: false,
    jump: false
};


function setKey(
    key,
    value
) {

    keys[key] = value;

    if (
        key === "jump" &&
        value
    ) {
        jumpBufferTimer =
            JUMP_BUFFER_TIME;
    }
}


window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "ArrowLeft" ||
            event.code === "KeyA"
        ) {
            keys.left = true;
            event.preventDefault();
        }

        if (
            event.code === "ArrowRight" ||
            event.code === "KeyD"
        ) {
            keys.right = true;
            event.preventDefault();
        }

        if (
            event.code === "Space" ||
            event.code === "ArrowUp" ||
            event.code === "KeyW"
        ) {
            if (!keys.jump) {
                setKey(
                    "jump",
                    true
                );
            }

            event.preventDefault();
        }

        if (
            event.code === "KeyR" &&
            gameOver
        ) {
            location.reload();
        }
    },
    {
        passive: false
    }
);


window.addEventListener(
    "keyup",
    function(event) {

        if (
            event.code === "ArrowLeft" ||
            event.code === "KeyA"
        ) {
            keys.left = false;
            event.preventDefault();
        }

        if (
            event.code === "ArrowRight" ||
            event.code === "KeyD"
        ) {
            keys.right = false;
            event.preventDefault();
        }

        if (
            event.code === "Space" ||
            event.code === "ArrowUp" ||
            event.code === "KeyW"
        ) {
            keys.jump = false;
            event.preventDefault();
        }
    },
    {
        passive: false
    }
);


/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

function holdButton(
    element,
    key
) {

    element.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            element.setPointerCapture(
                event.pointerId
            );

            setKey(
                key,
                true
            );
        }
    );

    element.addEventListener(
        "pointerup",
        function(event) {

            event.preventDefault();

            setKey(
                key,
                false
            );
        }
    );

    element.addEventListener(
        "pointercancel",
        function() {

            setKey(
                key,
                false
            );
        }
    );

    element.addEventListener(
        "pointerleave",
        function(event) {

            if (
                event.buttons === 0
            ) {
                setKey(
                    key,
                    false
                );
            }
        }
    );
}

/* =========================================================
   COLLISION HELPERS
   ========================================================= */

function playerHalfWidth() {
    return PLAYER_WIDTH / 2;
}


function isInsidePlatformX(
    p,
    platformData
) {

    const half =
        playerHalfWidth();

    return (
        p.position.x + half >
        platformData.x -
        platformData.width / 2
        &&
        p.position.x - half <
        platformData.x +
        platformData.width / 2
    );
}


function isInsidePlatformZ(
    p,
    platformData
) {

    const half =
        0.35;

    return (
        p.position.z + half >
        platformData.z -
        platformData.depth / 2
        &&
        p.position.z - half <
        platformData.z +
        platformData.depth / 2
    );
}


/* =========================================================
   PLATFORM COLLISION
   ========================================================= */

function updateGroundCollision() {

    const oldY =
        player.position.y;

    const bottom =
        player.position.y -
        PLAYER_HEIGHT / 2;

    let landingPlatform = null;

    for (
        const p of platforms
    ) {

        if (
            !isInsidePlatformX(
                player,
                p
            )
        ) {
            continue;
        }

        if (
            !isInsidePlatformZ(
                player,
                p
            )
        ) {
            continue;
        }

        const top =
            p.top;

        if (
            velocityY <= 0 &&
            bottom <= top + 0.35 &&
            bottom >= top - 1.0
        ) {

            landingPlatform = p;
            break;
        }
    }

    if (landingPlatform) {

        player.position.y =
            landingPlatform.top +
            PLAYER_HEIGHT / 2;

        velocityY = 0;

        onGround = true;

        coyoteTimer =
            COYOTE_TIME;

    } else {

        onGround = false;

        if (
            oldY >
            player.position.y
        ) {
            coyoteTimer = 0;
        }
    }
}


/* =========================================================
   HAZARD COLLISION
   ========================================================= */

function checkHazards() {

    const px =
        player.position.x;

    const py =
        player.position.y;

    const pz =
        player.position.z;

    for (
        const h of hazards
    ) {

        const hx =
            h.x;

        const hy =
            h.y;

        const hz =
            h.z;

        const hitX =
            Math.abs(px - hx) <
            (PLAYER_WIDTH / 2 +
             h.width / 2);

        const hitY =
            Math.abs(py - hy) <
            (PLAYER_HEIGHT / 2 +
             h.height / 2);

        const hitZ =
            Math.abs(pz - hz) <
            (0.45 +
             h.depth / 2);

        if (
            hitX &&
            hitY &&
            hitZ
        ) {
            return true;
        }
    }

    return false;
}


/* =========================================================
   COIN MILESTONE CELEBRATION
   ========================================================= */
function getCoinCelebrationMessage(count) {
    const messages = {
        10: "Ого, уже <span class=\"coinNumber\">10</span>!",
        20: "Невероятно, уже <span class=\"coinNumber\">20</span>!",
        30: "Давай-давай, уже <span class=\"coinNumber\">30</span>!",
        40: "Ух ты, уже <span class=\"coinNumber\">40</span>!",
        50: "Вот это темп — уже <span class=\"coinNumber\">50</span>!",
        60: "Мы не останавливаемся — <span class=\"coinNumber\">60</span>!"
    };
    if (messages[count]) return messages[count];
    return "Красота! Уже <span class=\"coinNumber\">" + count + "</span> монет!";
}

function showCoinCelebrationMessage(count) {
    const el = document.getElementById("coinCelebrationText");
    if (!el) return;
    el.innerHTML = '<span class="spark">✦</span>' + getCoinCelebrationMessage(count) + '<span class="spark">✦</span>';
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
}

function hideCoinCelebrationMessage() {
    const el = document.getElementById("coinCelebrationText");
    if (el) el.classList.remove("show");
}

function startCoinCelebration() {
    if (celebrationActive || coinCount <= 0 || coinCount % 10 !== 0) {
        return;
    }

    celebrationActive = true;
    celebrationTimer = 0;
    celebrationStartY = player.position.y;
    celebrationStartZ = player.position.z;
    celebrationStartRotY = player.rotation.y;
    winkTimer = 0;
    celebrationMessageTimer = 0;
    celebrationMilestone = coinCount;
    showCoinCelebrationMessage(coinCount);

    velocityX = 0;
    velocityY = 0;

    /* Руки вверх — сразу читается как победная эмоция. */
    leftArmPivot.rotation.x = -0.9;
    rightArmPivot.rotation.x = -0.9;

    /* Сначала оба глаза открыты. */
    leftEye.scale.y = 1;
    rightEye.scale.y = 1;
}

function updateCoinCelebration(realDt) {
    if (!celebrationActive) return;

    celebrationTimer += realDt;
    celebrationMessageTimer += realDt;

    const t = THREE.MathUtils.clamp(
        celebrationTimer / celebrationDuration,
        0,
        1
    );

    /* Камера получает красивую близкую композицию именно на лице. */
    /* Плавный прыжок вверх и мягкое приземление. */
    const jump = Math.sin(t * Math.PI) * 1.35;
    player.position.y = celebrationStartY + jump;
    player.position.z = celebrationStartZ;

    /* 0 -> лицо к камере -> полный разворот обратно. */
    const spin = THREE.MathUtils.smootherstep(t, 0, 1) * Math.PI * 2;
    player.rotation.y = celebrationStartRotY + spin;
    player.rotation.z = Math.sin(t * Math.PI) * 0.08;

    /* Ноги и руки делают живой акробатический жест. */
    const kick = Math.sin(t * Math.PI * 2.0);
    leftLegPivot.rotation.x = 0.32 * kick;
    rightLegPivot.rotation.x = -0.32 * kick;
    leftArmPivot.rotation.x = -0.95 + Math.sin(t * Math.PI * 4) * 0.18;
    rightArmPivot.rotation.x = -0.95 - Math.sin(t * Math.PI * 4) * 0.18;

    /* Подмигивание в момент, когда персонаж смотрит на камеру. */
    if (t > 0.26 && t < 0.58) {
        winkTimer += realDt;
        const wink = Math.sin(winkTimer * Math.PI * 5) > -0.15 ? 1 : 0.12;
        rightEye.scale.y = wink;
        leftEye.scale.y = 1;
    } else {
        rightEye.scale.y = 1;
        leftEye.scale.y = 1;
    }

    if (t >= 1) {
        celebrationActive = false;
        celebrationTimer = 0;
        winkTimer = 0;
        celebrationMessageTimer = 0;
        celebrationMilestone = 0;
        hideCoinCelebrationMessage();

        player.position.y = celebrationStartY;
        player.position.z = celebrationStartZ;
        player.rotation.y = celebrationStartRotY;
        player.rotation.z = 0;

        leftEye.scale.y = 1;
        rightEye.scale.y = 1;
    }
}


/* =========================================================
   COIN COLLECTION
   ========================================================= */

function updateCoins(
    time
) {

    if (celebrationActive) {
        return;
    }

    for (
        const coin of coins
    ) {

        if (
            coin.collected
        ) {
            continue;
        }

        coin.mesh.rotation.y +=
            3.2 * time;

        coin.mesh.rotation.z +=
            1.1 * time;

        coin.mesh.position.y =
            coin.baseY +
            Math.sin(
                animTime * 3 +
                coin.phase
            ) * 0.14;

        const dx =
            player.position.x -
            coin.mesh.position.x;

        const dy =
            player.position.y -
            coin.mesh.position.y;

        const dz =
            player.position.z -
            coin.mesh.position.z;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy +
                dz * dz
            );

        if (
            distance < 2.2
        ) {

            coin.collected = true;

            coin.mesh.visible = false;

            coinCount++;

            if (coinCount % 10 === 0) {
                startCoinCelebration();
            }

            updateUI();
        }
    }
}


/* =========================================================
   PLAYER ANIMATION
   ========================================================= */
function updatePlayerAnimation(
    dt
) {

    animTime += dt;

    const horizontalSpeed =
        Math.abs(velocityX);

    const running =
        onGround &&
        horizontalSpeed > 0.15;


    if (running) {

        const swing =
            Math.sin(
                animTime * 10
            ) * 0.48;

        const armSwing =
            Math.sin(
                animTime * 10
            ) * 0.34;


        leftLegPivot.rotation.x =
            THREE.MathUtils.damp(
                leftLegPivot.rotation.x,
                swing,
                14,
                dt
            );

        rightLegPivot.rotation.x =
            THREE.MathUtils.damp(
                rightLegPivot.rotation.x,
                -swing,
                14,
                dt
            );


        leftArmPivot.rotation.x =
            THREE.MathUtils.damp(
                leftArmPivot.rotation.x,
                -armSwing,
                14,
                dt
            );

        rightArmPivot.rotation.x =
            THREE.MathUtils.damp(
                rightArmPivot.rotation.x,
                armSwing,
                14,
                dt
            );

    } else if (onGround) {

        leftLegPivot.rotation.x =
            THREE.MathUtils.damp(
                leftLegPivot.rotation.x,
                0,
                12,
                dt
            );

        rightLegPivot.rotation.x =
            THREE.MathUtils.damp(
                rightLegPivot.rotation.x,
                0,
                12,
                dt
            );

        leftArmPivot.rotation.x =
            THREE.MathUtils.damp(
                leftArmPivot.rotation.x,
                0,
                12,
                dt
            );

        rightArmPivot.rotation.x =
            THREE.MathUtils.damp(
                rightArmPivot.rotation.x,
                0,
                12,
                dt
            );

    } else {

        /* JUMP */

        leftArmPivot.rotation.x =
            THREE.MathUtils.damp(
                leftArmPivot.rotation.x,
                -0.7,
                10,
                dt
            );

        rightArmPivot.rotation.x =
            THREE.MathUtils.damp(
                rightArmPivot.rotation.x,
                -0.7,
                10,
                dt
            );

        leftLegPivot.rotation.x =
            THREE.MathUtils.damp(
                leftLegPivot.rotation.x,
                0.25,
                10,
                dt
            );

        rightLegPivot.rotation.x =
            THREE.MathUtils.damp(
                rightLegPivot.rotation.x,
                -0.25,
                10,
                dt
            );
    }


    /* BODY LEAN */

    const targetTilt =
        THREE.MathUtils.clamp(
            -velocityX * 0.045,
            -0.28,
            0.28
        );

    player.rotation.z =
        THREE.MathUtils.damp(
            player.rotation.z,
            targetTilt,
            9,
            dt
        );


    /* SMALL BODY BOUNCE */

    const targetBodyY =
        running
            ? Math.abs(
                Math.sin(
                    animTime * 10
                )
            ) * 0.045
            : 0;

    body.position.y =
        THREE.MathUtils.damp(
            body.position.y,
            targetBodyY,
            12,
            dt
        );
}

/* =========================================================
   MOVING ICE SPIKES
   ========================================================= */

function updateHazards(dt) {

    dt *= celebrationActive ? celebrationScale : 1;

    for (const h of hazards) {
        if (!h.moving) continue;

        h.phase += h.speed * dt;

        /*
           Движение плавное и ограниченное платформой.
           Шип скользит влево-вправо именно ПО платформе.
        */
        let offset =
            Math.sin(h.phase) * h.amplitude;

        if (h.platform) {
            const maxOffset = Math.max(
                0,
                h.platform.width / 2 -
                h.width / 2 -
                0.35
            );

            offset = THREE.MathUtils.clamp(
                offset,
                -maxOffset,
                maxOffset
            );
        }

        h.x = h.baseX + offset;

        h.mesh.position.x = h.x;
        h.mesh.position.y = h.y;
        h.mesh.position.z = h.z;
    }
}


/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function updatePlayer(
    dt
) {

    if (celebrationActive) {
        return;
    }

    if (
        gameOver ||
        finished
    ) {
        return;
    }

    /* AUTO FORWARD */

    player.position.z -=
        getRunSpeed() * dt;


    /* HORIZONTAL INPUT */

    let direction = 0;

    if (keys.left) {
        direction -= 1;
    }

    if (keys.right) {
        direction += 1;
    }


    /* SMOOTH ACCELERATION */

    if (direction !== 0) {

        const target =
            direction *
            SIDE_SPEED;

        velocityX =
            THREE.MathUtils.damp(
                velocityX,
                target,
                SIDE_ACCEL,
                dt
            );

    } else {

        velocityX =
            THREE.MathUtils.damp(
                velocityX,
                0,
                SIDE_FRICTION,
                dt
            );
    }


    player.position.x +=
        velocityX * dt;


    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -WORLD_LIMIT_X,
            WORLD_LIMIT_X
        );


    /* COYOTE TIME */

    if (
        !onGround &&
        coyoteTimer > 0
    ) {
        coyoteTimer -= dt;
    }


    /* JUMP BUFFER */

    if (
        jumpBufferTimer > 0
    ) {
        jumpBufferTimer -= dt;
    }


    /* JUMP */

    if (
        jumpBufferTimer > 0 &&
        (
            onGround ||
            coyoteTimer > 0
        )
    ) {

        velocityY =
            JUMP_FORCE;

        onGround = false;

        coyoteTimer = 0;

        jumpBufferTimer = 0;
    }


    /* GRAVITY */

    velocityY -=
        GRAVITY * dt;


    /* SHORT JUMP */

    if (
        !keys.jump &&
        velocityY > 0
    ) {

        velocityY -=
            GRAVITY * 0.65 * dt;
    }


    player.position.y +=
        velocityY * dt;


    updateGroundCollision();


    /* FALL */

    if (
        player.position.y < -8
    ) {

        showGameOver(
            "Ты упал!"
        );

        return;
    }


    /* HAZARDS */

    if (
        checkHazards()
    ) {

        showGameOver(
            "Ой! Препятствие!"
        );

        return;
    }


    /* БЕСКОНЕЧНАЯ ТРАССА */

    ensureInfiniteWorld();
}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(
    dt
) {

    /* Во время юбилейной анимации камера плавно подъезжает
       прямо к лицу. Персонаж уже развёрнут к ней на этом этапе. */
    if (celebrationActive) {
        const closeT = THREE.MathUtils.smoothstep(
            THREE.MathUtils.clamp(celebrationTimer / 0.55, 0, 1),
            0,
            1
        );

        const faceX = player.position.x;
        const faceY = player.position.y + 0.78;
        const faceZ = player.position.z + 2.65;

        camera.position.x = THREE.MathUtils.damp(
            camera.position.x,
            faceX,
            9.0,
            dt
        );
        camera.position.y = THREE.MathUtils.damp(
            camera.position.y,
            faceY + 0.18,
            9.0,
            dt
        );
        camera.position.z = THREE.MathUtils.damp(
            camera.position.z,
            faceZ,
            8.5,
            dt
        );

        const faceLook = new THREE.Vector3(
            player.position.x,
            player.position.y + 0.82,
            player.position.z - 0.05
        );
        camera.lookAt(faceLook);

        /* Чуть шире угол обзора, чтобы лицо красиво помещалось в кадре. */
        camera.fov = THREE.MathUtils.damp(camera.fov, 52, 7, dt);
        camera.updateProjectionMatrix();
        return;
    }

    const targetX =
        player.position.x * 0.38;

    const targetY =
        player.position.y + 5.2;

    const targetZ =
        player.position.z + 10.5;

    camera.position.x =
        THREE.MathUtils.damp(
            camera.position.x,
            targetX,
            5.5,
            dt
        );

    camera.position.y =
        THREE.MathUtils.damp(
            camera.position.y,
            targetY,
            5.5,
            dt
        );

    camera.position.z =
        THREE.MathUtils.damp(
            camera.position.z,
            targetZ,
            7,
            dt
        );

    const lookTarget =
        new THREE.Vector3(
            player.position.x * 0.35,
            player.position.y + 0.6,
            player.position.z - 8
        );

    camera.lookAt(
        lookTarget
    );

    camera.fov = THREE.MathUtils.damp(camera.fov, 60, 5, dt);
    camera.updateProjectionMatrix();
}


/* =========================================================
   SNOW ANIMATION
   ========================================================= */

function updateSnow(
    dt
) {

    const position =
        snowParticles.geometry
            .attributes
            .position;

    for (
        let i = 0;
        i < snowParticleCount;
        i++
    ) {

        let x =
            position.array[i * 3];

        let y =
            position.array[i * 3 + 1];

        let z =
            position.array[i * 3 + 2];

        y -=
            dt * 1.8;

        z +=
            getRunSpeed() * dt * 0.25;

        x +=
            Math.sin(
                animTime * 0.8 +
                i
            ) * dt * 0.15;

        if (
            y < 0
        ) {
            y = 27;
        }

        if (
            z > player.position.z + 18
        ) {
            z =
                player.position.z - 100;
        }

        position.array[i * 3] =
            x;

        position.array[i * 3 + 1] =
            y;

        position.array[i * 3 + 2] =
            z;
    }

    position.needsUpdate = true;
}


/* =========================================================
   UI
   ========================================================= */

function updateUI() {

    document.getElementById(
        "coinsUI"
    ).textContent =
        "❄️ Монеты: " +
        coinCount;

    const distance =
        Math.max(
            0,
            Math.round(
                START_Z -
                player.position.z
            )
        );

    document.getElementById(
        "distanceUI"
    ).textContent =
        "Дистанция: " +
        distance +
        " м";

    const level = currentLevel();

    document.getElementById(
        "levelUI"
    ).textContent =
        "Уровень: " +
        level;
}


/* =========================================================
   GAME OVER
   ========================================================= */

function showGameOver(
    text
) {

    if (
        gameOver
    ) {
        return;
    }

    gameOver = true;

    document.getElementById(
        "messageTitle"
    ).textContent =
        "Игра окончена";

    document.getElementById(
        "messageText"
    ).textContent =
        text +
        " Монеты: " +
        coinCount;

    document.getElementById(
        "message"
    ).classList.add(
        "show"
    );
}


/* =========================================================
   FINISH
   ========================================================= */

function finishGame() {

    if (
        finished
    ) {
        return;
    }

    finished = true;

    document.getElementById(
        "messageTitle"
    ).textContent =
        "🏆 Финиш!";

    document.getElementById(
        "messageText"
    ).textContent =
        "Ты прошёл зимний паркур и собрал " +
        coinCount +
        " из " +
        coins.length +
        " монет.";

    document.getElementById(
        "message"
    ).classList.add(
        "show"
    );
}


/* =========================================================
   RESTART
   ========================================================= */

document.getElementById(
    "restartButton"
).addEventListener(
    "click",
    function() {

        location.reload();
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );
    }
);


/* =========================================================
   INITIALIZE INFINITE WORLD
   ========================================================= */

ensureInfiniteWorld();


/* =========================================================
   INITIAL CAMERA
   ========================================================= */

camera.position.set(
    0,
    5.2,
    13
);

camera.lookAt(
    0,
    1,
    -5
);


/* =========================================================
   GAME LOOP
   ========================================================= */

function animate(
    currentTime
) {

    requestAnimationFrame(
        animate
    );

    let dt =
        (currentTime -
         previousTime) /
        1000;

    previousTime =
        currentTime;

    dt =
        Math.min(
            dt,
            0.033
        );


    const worldDt =
        dt * (celebrationActive ? celebrationScale : 1);

    updatePlayer(
        worldDt
    );

    updateHazards(
        worldDt
    );

    updateCamera(
        worldDt
    );

    updateCoins(
        worldDt
    );

    if (!celebrationActive) {
        updatePlayerAnimation(
            worldDt
        );
    }

    updateCoinCelebration(
        dt
    );

    updateSnow(
        worldDt
    );

    updateUI();


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
   ========================================================= */

updateUI();

requestAnimationFrame(
    animate
);

</script>

</html>
